# Two ways to run Seek. The default works from any host on the LAN; the
# floppy-net variant is the spec §2 shape for running on Floppy's own host.

services:
  seek:
    build: .
    image: seek:latest
    container_name: seek
    restart: unless-stopped
    # FLOPPY_URL, FLOPPY_TOKEN, TMDB_API_KEY, SEEK_SESSION_SECRET, SEEK_PASSPHRASE
    env_file: .env
    environment:
      - "TZ=America/New_York"
    volumes:
      # Seek's own preferences only (§8). Create it first, or swap for a
      # named volume. Floppy remains the sole owner of watch state.
      - ./data:/data
    ports:
      - "8100:8100"

# ── Running on Floppy's Docker host (spec §2) ────────────────────────────────
# Reaching Floppy by container name beats traversing the LAN. To do that:
#   1. set FLOPPY_URL=http://floppy:8000 in .env  (check the container name)
#   2. uncomment the two blocks below
#
#    networks:
#      - floppy-net
#
# networks:
#   floppy-net:
#     external: true

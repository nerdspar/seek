# =============================================================================
# Seek — self-hosted PWA for tracking shows, films and books.
# The image is built by GitHub Actions and pulled from GHCR; TrueNAS just runs
# it. Nothing secret goes in this file: Seek generates its own secrets, and the
# household's services (TMDB, BookOrbit, Hardcover, Sonarr, Radarr,
# email) are set in the app under Settings → Services.
#
# ── 1. Create the storage folder on your NAS ─────────────────────────────
#        mkdir -p /mnt/NAS/Data/seek
#        chown -R 1000:1000 /mnt/NAS/Data/seek
#      (The container runs as the `node` user, uid 1000.)
#      This holds everything Seek keeps: accounts, settings, what you track and
#      every play (seek.db), and its generated secrets (secrets.json). Back it
#      up with the rest of /mnt/NAS/Data.
#
# ── 2. Log in to GHCR once (private image) and launch ────────────────────
#        docker login ghcr.io -u nerdspar     # paste a read:packages PAT
#        docker compose up -d
#
# ── 3. Set up in the browser ─────────────────────────────────────────────
#      Open http://<nas-ip>:8100. Seek asks for a setup code — it's printed in
#      the container log ("First-run setup code: XXXX-XXXX"; TrueNAS → Apps →
#      Seek → Logs). Create your account, then add a TMDB key under
#      Settings → Services and paste your Jellyfin webhook URL (Your accounts)
#      into Jellyfin's Webhook plugin.
#      On the iPhone: Share → Add to Home Screen. See DEPLOY.md for more.
# =============================================================================

services:
  seek:
    # Image built by .github/workflows/docker-publish.yml. To build on the box
    # instead, comment out `image:` and uncomment `build: .`.
    image: ghcr.io/nerdspar/seek:latest
    # build: .
    container_name: seek
    restart: unless-stopped
    environment:
      TZ: "America/New_York"
      # That's all. Upgrading from an older Seek? Leave your existing variables
      # here for the first boot: Seek copies them into Settings → Services and
      # onto your account, logs which ones, and after that they can be deleted.

    ports:
      # host:container — the app listens on 8100 inside the container. Change
      # the LEFT number if 8100 is already taken on your NAS.
      - "8100:8100"

    volumes:
      - /mnt/NAS/Data/seek:/data

    healthcheck:
      # Reports unhealthy if Seek can't read its own database.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

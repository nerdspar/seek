<!doctype html>
<html lang="en" data-theme="midnight">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
		/>
		<meta name="theme-color" content="#08080C" />
		<meta name="color-scheme" content="dark" />
		<title>Seek</title>

		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/seek-180.png" />
		<link rel="icon" href="/seek-icon.svg" type="image/svg+xml" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<!-- Translucent on purpose: iOS blurs page content as it scrolls under the
		     status bar, which is the effect we want. It does mean content must be
		     held clear of that band at rest — see --header-top in app.css. -->
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Seek" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

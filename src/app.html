<!doctype html>
<html lang="en" data-appearance="%seek.appearance%" data-accent="%seek.accent%">
	<head>
		<meta charset="utf-8" />
		<!-- Deliberately NOT viewport-fit=cover. With `cover` the web view spans
		     the whole screen and iOS draws its uncloseable "Liquid Glass" scroll-
		     edge blur over the top of a standalone PWA. Without it, iOS keeps the
		     content inside the safe area (below the status bar, above the home
		     indicator) and the blur ramp has nothing to fall on — the fix hunter-
		     irving/events uses. The status-bar tint strip below finishes the job. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<!-- Both are rewritten per request from preferences; the media queries are
		     what make "follow the phone" work for the browser chrome too. -->
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="%seek.themeColorDark%" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="%seek.themeColorLight%" />
		<meta name="color-scheme" content="%seek.colorScheme%" />
		<title>Seek</title>

		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- iOS picks per device: 180 iPhone @3x, 167 iPad Pro, 152 iPad, 120
		     iPhone @2x. Without the smaller entries it downsamples the 180 and
		     the check loses its edge.

		     The ?v= is not decoration. These are served with a four-hour
		     max-age and the filenames never change, so a new icon behind an old
		     URL stays invisible until the cache expires — and iOS captures a
		     home-screen icon once at install and never refreshes it, so a stale
		     fetch gets baked in for good. Bump the version whenever the artwork
		     changes; see brand/README.md. -->
		<link rel="apple-touch-icon" sizes="180x180" href="/seek-180.png?v=2" />
		<link rel="apple-touch-icon" sizes="167x167" href="/seek-167.png?v=2" />
		<link rel="apple-touch-icon" sizes="152x152" href="/seek-152.png?v=2" />
		<link rel="apple-touch-icon" sizes="120x120" href="/seek-120.png?v=2" />
		<link rel="icon" href="/seek-icon.svg?v=2" type="image/svg+xml" />
		<link rel="icon" sizes="32x32" type="image/png" href="/seek-32.png?v=2" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<!-- Always `default` (opaque), never `black-translucent`. Frozen at install,
		     so a change here only lands after the app is removed and re-added to the
		     Home Screen. See hooks.server.ts and app.css for the full blur story. -->
		<meta name="apple-mobile-web-app-status-bar-style" content="%seek.statusBar%" />
		<meta name="apple-mobile-web-app-title" content="Seek" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<!-- Status-bar tint strip. A real, fixed, opaque element pinned to the very
		     top edge: iOS 26+/27 samples it and treats the top as solid chrome,
		     which suppresses the "Liquid Glass" scroll-edge blur ramp instead of us
		     shoving the header 40px down to clear it. Standalone + portrait only
		     (see app.css); a no-op in a browser tab, where it stays display:none. -->
		<div class="status-tint" aria-hidden="true"></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

name: Build and publish container

# Builds the Docker image and pushes it to GitHub Container Registry (GHCR)
# at ghcr.io/<owner>/<repo>. TrueNAS then pulls this image (see DEPLOY.md).

on:
  push:
    branches: [main]
    tags: ['v*'] # also publish an image per release tag
  workflow_dispatch: # allow manual runs from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # metadata-action lowercases this

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64 # TrueNAS SCALE is x86-64
          push: true
          # Stamp the commit into the image so /api/health can report what's
          # actually running — the answer to "did I redeploy the latest?".
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=seek
          cache-to: type=gha,mode=max,scope=seek

      # The Floppy MCP server (mcp/) ships as its own image so TrueNAS can pull it
      # like the app, rather than build from source it does not have. Published to
      # ghcr.io/<owner>/<repo>-mcp; docker-compose.yml's seek-mcp service uses it.
      - name: Derive MCP image tags
        id: meta_mcp
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push MCP server
        uses: docker/build-push-action@v7
        with:
          context: ./mcp
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_mcp.outputs.tags }}
          labels: ${{ steps.meta_mcp.outputs.labels }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

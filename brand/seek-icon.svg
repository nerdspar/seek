<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Seek">
  <defs>
    <!-- userSpaceOnUse so the same gradient can paint both the tile and the
         check. The check is stroked in the tile gradient, so wherever it
         overshoots the disc it matches the background exactly - no clip
         needed, and no gradient fringe left showing past the stroke. -->
    <linearGradient id="tile" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="512">
      <stop offset="0" stop-color="#1C1B32"/>
      <stop offset="1" stop-color="#08080C"/>
    </linearGradient>
    <linearGradient id="sig" gradientUnits="userSpaceOnUse" x1="110" y1="110" x2="402" y2="402">
      <stop offset="0" stop-color="#5B6CFF"/>
      <stop offset="1" stop-color="#B36BFF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <circle cx="256" cy="256" r="146" fill="url(#sig)"/>
  <path d="M180 258 L236 314 L430 106" fill="none" stroke="url(#tile)"
        stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
